name: Methane Pipeline Cloud Automation

on:
  repository_dispatch:
    types: [trigger_baseline_build]
  workflow_dispatch:

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install rioxarray xarray rasterio pystac-client pystac urllib3

    - name: Write Dispatched Configuration Payload
      if: github.event_name == 'repository_dispatch'
      run: |
        echo "${{ json(github.event.client_payload) }}" > bin/config.json

    - name: Restore Pre-built Baselines from GitHub Cache
      uses: actions/cache@v4
      with:
        path: |
          **/baseline/*.tif
        # Generates a persistent unique storage reference tag based on your configuration file data
        key: baseline-cache-${{ hashFiles('bin/config.json') }}
        restore-keys: |
          baseline-cache-

    - name: Run Native Cloud Baseline Builder
      run: |
        python src/build_baseline.py bin/config.json

    - name: Upload Completed Artifacts back to User Machine
      uses: actions/upload-artifact@v4
      with:
        name: completed-methane-baselines
        path: |
          **/baseline/*.tif
          bin/config.json
        retention-days: 5
