name: Methane Pipeline Cloud Automation

on:
  repository_dispatch:
    types: [trigger_baseline_build]

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Dispatched Configuration Payload
      env:
        Payload: ${{ toJSON(github.event.client_payload) }}
      run: |
        mkdir -p bin
        printf '%s' "$PAYLOAD" > bin/config.json

    - name: Run Native Cloud Baseline Builder
      env:
        CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
        CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
      run: |
        python src/build_baseline.py bin/config.json

    - name: Publish Baselines to Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view baselines >/dev/null 2>&1 || gh release create baselines --title "Baselines" --notes "Cloud-built methane baseline mosaics."
        gh release upload baselines cloud_out/*.tif --clobber