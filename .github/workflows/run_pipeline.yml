name: Methane Pipeline Cloud Automation

on:
  # Allows your local Windows Batch script to trigger execution remotely via API
  repository_dispatch:
    types: [trigger_baseline_build]
  
  # Allows manual triggers directly from the GitHub website interface
  workflow_dispatch:

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Automatically caches installed dependencies to speed up future runs

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install boto3 rioxarray xarray rasterio pystac-client pystac urllib3

    - name: Write Dispatched Configuration Payload
      if: github.event_name == 'repository_dispatch'
      run: |
        # Creates the runtime configuration from the local Batch machine's upload payload
        echo '${{ json(github.event.client_payload) }}' > bin/config.json

    - name: Fallback Default Configuration
      if: github.event_name == 'workflow_dispatch'
      run: |
        # Fallback mechanism if triggered manually through the browser interface
        if [ ! -f bin/config.json ]; then
          mkdir -p bin
          echo '{"aois": []}' > bin/config.json
        fi

    - name: Run Cloud-First Baseline Builder
      # Maps your encrypted repository credentials directly into the script environment securely
      env:
        USER_CLOUD_BUCKET_NAME: ${{ secrets.USER_CLOUD_BUCKET_NAME }}
        USER_AWS_ACCESS_KEY_ID: ${{ secrets.USER_AWS_ACCESS_KEY_ID }}
        USER_AWS_SECRET_ACCESS_KEY: ${{ secrets.USER_AWS_SECRET_ACCESS_KEY }}
      run: |
        python src/build_baseline.py bin/config.json

    - name: Upload Completed Artifacts back to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: completed-methane-baselines
        path: |
          **/baseline/*.tif
          bin/config.json
        retention-days: 5
